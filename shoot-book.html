<!-- ============================================================
     SETUP — read this before anything else
     ============================================================
     FIREBASE (required)
     1. https://console.firebase.google.com > create a free project.
     2. Build > Firestore Database > Create database (production mode).
     3. Build > Authentication > Sign-in method > enable Email/Password.
        Then in the Users tab, create THREE accounts to start:
          - your own admin account (any email/password you'll remember)
          - a shared Guns account, e.g. guns@yourclub.local / a password
          - a shared Beaters account, e.g. beaters@yourclub.local / a password
        You can add more admin accounts later the same way.
     4. Project settings > General > Your apps > "</>" web icon >
        register an app > copy the firebaseConfig below.
     5. Firestore > Rules tab, paste and Publish:

        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /sheets/{doc} { allow read, write: if request.auth != null; }
            match /settings/{doc} { allow read, write: if request.auth != null; }
            match /shootdays/{doc} { allow read, write: if request.auth != null; }
          }
        }

        (Everything requires sign-in now — Guns/Beaters/Admin all need
         one of the three logins above to see anything at all.)

     6. Below, set ADMIN_EMAILS to your own email (a starting list —
        you can add more admins later from the Settings screen, but you
        still need to create their Firebase Auth account in step 3 first).
        Set GUNS_LOGIN_EMAIL / BEATERS_LOGIN_EMAIL to the two shared
        accounts you created.

     GEMINI (optional — photo pre-fill on Add Sheet)
     https://aistudio.google.com/app/apikey — free key, paste below.
     Leave blank to hide the photo-upload button.

     WEATHER (automatic, via Open-Meteo — free, no key needed)
     Set SHOOT_LAT / SHOOT_LON to your shoot's location.
     ============================================================ -->

];
const FORMULA_TERMS = [
  {key:"shots", label:"Shots (cartridges)"},
  {key:"animalsShot", label:"Animals shot"},
  {key:"legs", label:"Legs"},
  {key:"speciesCount", label:"No. of species"},
  {key:"sweepSum", label:"Sum of sweep numbers"},
  {key:"gunsCount", label:"No. of guns"},
  {key:"beatersCount", label:"No. of beaters"},
  {key:"guestsCount", label:"No. of guests"}
];

let allSheets = [], allShootDays = [];
let sheetsLoaded=false, settingsLoaded=false, shootDaysLoaded=false;
let appSettings = { drivesEnabled:false, driveNames:[], speciesList: DEFAULT_SPECIES, adminEmails:[], seasonFormulas:{}, siteTitle:"Wing Shoot Gamebook" };
let authRole = null; // 'admin' | 'gun' | 'beater' | null
let currentTab = "shootdays";
let editingId = null;

/* ---------------- season helpers ---------------- */
function seasonKeyForDate(d){
  const y=d.getFullYear(), m=d.getMonth();
  if (m>=8) return y;
  if (m===0) return y-1;
  if (m===1 && d.getDate()<=2) return y-1;
  return null;
}
function seasonLabel(startYear){ return startYear + "/" + String(startYear+1).slice(-2); }
function allSeasonKeys(){
  const keys = new Set();
  allSheets.forEach(s=>{ const k=seasonKeyForDate(new Date(s.date)); if(k!==null) keys.add(k); });
  allShootDays.forEach(s=>{ const k=seasonKeyForDate(new Date(s.date)); if(k!==null) keys.add(k); });
  const cur = seasonKeyForDate(new Date());
  if (cur!==null) keys.add(cur);
  return Array.from(keys).sort((a,b)=>b-a);
}

/* ---------------- auth ---------------- */
auth.onAuthStateChanged(user=>{
  if (!user){ authRole = null; }
  else if (user.email === GUNS_LOGIN_EMAIL){ authRole = 'gun'; }
  else if (user.email === BEATERS_LOGIN_EMAIL){ authRole = 'beater'; }
  else if ((appSettings.adminEmails||[]).includes(user.email)){ authRole = 'admin'; }
  else { authRole = 'admin_pending'; } // signed in but not on the admin list yet
  renderAuthBar();
  buildNav();
  if (authRole && currentTab==='signin') currentTab='shootdays';
  if (!authRole) currentTab='signin';
  render();
});
function renderAuthBar(){
  const el = document.getElementById('authStatus');
  if (authRole){
    const label = authRole==='admin' ? 'Admin' : authRole==='gun' ? 'Guns' : authRole==='beater' ? 'Beaters' : 'Signed in (not yet an admin)';
    el.innerHTML = `${label} &nbsp;·&nbsp; <span class="link" onclick="doSignOut()">Sign out</span>`;
  } else {
    el.textContent = 'Please sign in';
  }
}
function doSignOut(){ auth.signOut(); }
function buildNav(){
  const nav = document.getElementById('navTabs');
  if (!authRole){ nav.innerHTML=''; return; }
  const tabs = [
    {id:'shootdays', label:'Shoot Days'},
    {id:'totals', label:'Season Totals'},
    {id:'compare', label:'Compare Seasons'},
    {id:'sheets', label:'Weekly Sheets'}
  ];
  if (authRole==='admin'){
    tabs.push({id:'add', label:'Add Sheet'});
    tabs.push({id:'settings', label:'Settings'});
  }
  nav.innerHTML = tabs.map(t=>`<button data-tab="${t.id}" class="${currentTab===t.id?'active':''}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=> switchTab(b.dataset.tab)));
}
function switchTab(tab){ currentTab = tab; buildNav(); render(); }

/* ---------------- data load ---------------- */
db.collection('sheets').orderBy('date','desc').onSnapshot(snap=>{
  allSheets = snap.docs.map(d=>({id:d.id, ...d.data()}));
  sheetsLoaded = true; render();
}, ()=>{ sheetsLoaded = true; render(); });

db.collection('shootdays').orderBy('date','asc').onSnapshot(snap=>{
  allShootDays = snap.docs.map(d=>({id:d.id, ...d.data()}));
  shootDaysLoaded = true; render();
}, ()=>{ shootDaysLoaded = true; render(); });

db.collection('settings').doc('config').onSnapshot(doc=>{

/* ---------------- render router ---------------- */
let selectedSeason = null;
function render(){
  const app = document.getElementById('app');
  if (!sheetsLoaded || !settingsLoaded || !shootDaysLoaded){ app.innerHTML='<div class="loading">Loading the book…</div>'; return; }
  if (!authRole) return renderSignIn(app);
  if (authRole==='admin_pending') return renderPending(app);
  if (currentTab==='shootdays') return renderShootDays(app);
  if (currentTab==='totals') return renderTotals(app);
  if (currentTab==='compare') return renderCompare(app);
  if (currentTab==='sheets') return renderSheetsList(app);
  if (currentTab==='sheet-detail') return renderSheetDetail(app);
  if (currentTab==='add' && authRole==='admin') return renderAddForm(app);
  if (currentTab==='settings' && authRole==='admin') return renderSettings(app);
  currentTab='shootdays'; return renderShootDays(app);
}
function renderSignIn(app){

    <div class="card" style="max-width:380px;margin:40px auto;">

/* ================= SHOOT DAYS & GUEST SCHEDULE ================= */
function renderShootDays(app){
  const seasons = allSeasonKeys();
  if (selectedSeason===null) selectedSeason = seasons[0] ?? null;
  const rows = allShootDays.filter(d=>seasonKeyForDate(new Date(d.date))===selectedSeason)
                            .sort((a,b)=> new Date(a.date)-new Date(b.date));
  app.innerHTML = `
    <div class="season-row">
      <span class="season-label">Season</span>
      <select id="sdSeasonSelect">${seasons.map(k=>`<option value="${k}" ${k===selectedSeason?'selected':''}>${seasonLabel(k)}</option>`).join('')}</select>
      ${authRole==='admin' ? `<button class="btn small" onclick="addShootDayRow()">+ add shoot day</button>` : ''}
    </div>
    <div class="card">
      <h2>Shoot Days &amp; Guest Schedule</h2>
      <p class="hint">${seasonLabel(selectedSeason)} season.</p>
      <table>
        <tr><th>Day</th><th>Date</th><th>Guest 1</th><th>Guest 2 / Note</th>${authRole==='admin'?'<th></th>':''}</tr>
        ${rows.map(d=>{
          const dt = new Date(d.date);
          const dayName = dt.toLocaleDateString('en-GB',{weekday:'long'});
          const dateStr = dt.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit'});
          if (authRole==='admin'){
            return `<tr>
              <td><b>${dayName}</b></td>
              <td><input type="date" value="${d.date}" onchange="updateShootDay('${d.id}','date',this.value)" style="min-width:130px;"></td>
              <td><input type="text" value="${d.guest1||''}" onchange="updateShootDay('${d.id}','guest1',this.value)"></td>
              <td><input type="text" value="${d.guest2||''}" onchange="updateShootDay('${d.id}','guest2',this.value)"></td>
              <td><button class="remove-x" onclick="deleteShootDay('${d.id}')">&times;</button></td>
            </tr>`;
          }
          return `<tr><td><b>${dayName}</b></td><td>${dateStr}</td><td>${d.guest1||'—'}</td><td>${d.guest2||'—'}</td></tr>`;
        }).join('') || `<tr><td colspan="5" style="color:#8a7f6c;">No shoot days set for this season yet.</td></tr>`}

      <p class="hint" style="margin-top:16px;margin-bottom:0;">Any problems please let me know.</p>

function addShootDayRow(){
  const today = new Date();
  db.collection('shootdays').add({ date: today.toISOString().slice(0,10), guest1:'', guest2:'' });
}
function updateShootDay(id, field, val){
  db.collection('shootdays').doc(id).update({[field]: val});
}
function deleteShootDay(id){
  if (!confirm('Remove this shoot day?')) return;
  db.collection('shootdays').doc(id).delete();
}

/* ================= grand total formula engine ================= */
function computeSheetFacts(payload){
  const guns=payload.guns||[], beaters=payload.beaters||[], guests=payload.guests||[];
  const speciesList = appSettings.speciesList || DEFAULT_SPECIES;
  let animalsShot=0, legs=0;
  Object.entries(payload.game||{}).forEach(([key,count])=>{
    const baseName = key.replace(/ \((M|F)\)$/,'');
    const sp = speciesList.find(s=>s.name===baseName);
    animalsShot += Number(count||0);
    legs += Number(count||0) * (sp ? sp.legs : 2);
  });
  const speciesCount = new Set(Object.keys(payload.game||{}).map(k=>k.replace(/ \((M|F)\)$/,''))).size;
  const sweepSum = [...guns,...beaters,...guests].reduce((a,p)=>a+Number(p.sweep||0),0);
  return {
    shots: Number(payload.cartridges||0),
    animalsShot, legs, speciesCount, sweepSum,
    gunsCount: guns.length, beatersCount: beaters.length, guestsCount: guests.length
  };
}
function getSeasonFormula(seasonKey){
  const f = (appSettings.seasonFormulas||{})[seasonKey];
  if (f && f.length) return f;
  return [{term:'shots',op:null},{term:'legs',op:'+'}]; // sensible fallback default
}
function evalFormula(formula, facts){
  let result = null;
  formula.forEach(step=>{
    const val = facts[step.term] || 0;
    if (result===null){ result = val; return; }
    if (step.op==='+') result += val;
    else if (step.op==='-') result -= val;
    else if (step.op==='×') result *= val;
    else if (step.op==='÷') result = val ? result/val : result;
  });
  return result||0;
}
function formulaTermLabel(key){ return (FORMULA_TERMS.find(t=>t.key===key)||{}).label || key; }
function formulaBreakdownHTML(formula, facts, total){
  const parts = formula.map((step,i)=>{
    const val = facts[step.term]||0;
    const opHtml = step.op ? `<span class="op">${step.op}</span>` : '';
    return `${opHtml}${formulaTermLabel(step.term)} (${val})`;
  });
  return `<div class="formula-strip">${parts.join(' ')} <span class="eq">= ${total}</span></div>`;
}

/* ================= SEASON TOTALS ================= */
function renderTotals(app){
  const seasons = allSeasonKeys();
  if (selectedSeason===null) selectedSeason = seasons[0] ?? null;
  if (seasons.length===0){

  seasonSheets.forEach(s=>{

    totalShot += Number(s.totalShot||0);
    grandTotal += Number(s.grandTotal||0);
    (s.guns||[]).forEach(p=>addAtt(p.name,'Gun'));

  });
  function addAtt(name,role){ if(!name)return; attendance[name]=role; }
  const speciesRows = Object.entries(speciesTotals).filter(([,c])=>c>0);
  const roleOrder = {Gun:0, Beater:1, Guest:2};
  const attRows = Object.entries(attendance).sort((a,b)=> (roleOrder[a[1]]-roleOrder[b[1]]) || a[0].localeCompare(b[0]));

  app.innerHTML = `

/* ================= COMPARE SEASONS ================= */
let compareSelected=new Set(), compareCutoffOn=false, compareCutoffDate=null;
function aggregateSeason(seasonKey, cutoffMonthDay){
  const sheets = allSheets.filter(s=>{
    if (seasonKeyForDate(new Date(s.date))!==seasonKey) return false;
    if (cutoffMonthDay){
      const d = new Date(s.date);
      const cutoffYear = cutoffMonthDay.month<=1 ? seasonKey+1 : seasonKey;
      const cutoffDate = new Date(cutoffYear, cutoffMonthDay.month, cutoffMonthDay.day, 23,59,59);
      if (d>cutoffDate) return false;
    }
    return true;
  });
  const speciesList = appSettings.speciesList || DEFAULT_SPECIES;
  const speciesTotals={}; speciesList.forEach(sp=>speciesTotals[sp.name]=0);
  const attendance={};
  let totalShot=0, grandTotal=0;
  sheets.forEach(s=>{
    Object.entries(s.game||{}).forEach(([key,count])=>{
      const base=key.replace(/ \((M|F)\)$/,'');
      speciesTotals[base]=(speciesTotals[base]||0)+Number(count||0);
    });
    totalShot+=Number(s.totalShot||0); grandTotal+=Number(s.grandTotal||0);
    (s.guns||[]).forEach(p=>addAtt(p.name,'Gun'));
    (s.beaters||[]).forEach(p=>addAtt(p.name,'Beater'));
    (s.guests||[]).forEach(p=>addAtt(p.name,'Guest'));
  });
  function addAtt(name,role){ if(!name)return; attendance[name]=role; }
  const speciesCount = Object.values(speciesTotals).filter(v=>v>0).length;
  return { sheets, speciesTotals, speciesCount, attendance, totalShot, grandTotal };
}
function renderCompare(app){
  const seasons = allSeasonKeys();
  if (seasons.length<2){
    app.innerHTML = `<div class="card"><div class="empty"><span class="serif">Not enough seasons yet</span>Compare will be useful once you've got two or more seasons logged.</div></div>`;
    return;
  }
  if (compareSelected.size===0) compareSelected = new Set(seasons.slice(0,2));
  if (!compareCutoffDate){ const t=new Date(); compareCutoffDate={month:t.getMonth(), day:t.getDate()}; }
  const selected = seasons.filter(k=>compareSelected.has(k));
  const cutoff = compareCutoffOn ? compareCutoffDate : null;
  const results = selected.map(k=>({key:k, agg: aggregateSeason(k, cutoff)}));
  const allNames = new Set();
  results.forEach(r=>Object.keys(r.agg.attendance).forEach(n=>allNames.add(n)));
  const speciesList = appSettings.speciesList || DEFAULT_SPECIES;

  app.innerHTML = `
    <div class="card">
      <h2>Compare seasons</h2>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;">
        ${seasons.map(k=>`<label style="display:flex;align-items:center;gap:6px;font-size:14px;">
          <input type="checkbox" ${compareSelected.has(k)?'checked':''} onchange="toggleCompareSeason(${k}, this.checked)"> ${seasonLabel(k)}</label>`).join('')}
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;">
          <input type="checkbox" ${compareCutoffOn?'checked':''} onchange="toggleCutoff(this.checked)"> Only count sheets up to</label>
        <input type="date" value="2000-${String(compareCutoffDate.month+1).padStart(2,'0')}-${String(compareCutoffDate.day).padStart(2,'0')}" ${compareCutoffOn?'':'disabled'} onchange="setCutoffDate(this.value)" style="width:auto;">
      </div>
    </div>
    <div class="card" style="overflow-x:auto;">
      <h2>Headline totals</h2>
      <table><tr><th>Season</th><th class="num">Grand total</th><th class="num">Total shot</th><th class="num">Species</th><th class="num">Sheets</th></tr>
      ${results.map(r=>`<tr><td>${seasonLabel(r.key)}</td><td class="num">${r.agg.grandTotal.toLocaleString()}</td><td class="num">${r.agg.totalShot}</td><td class="num">${r.agg.speciesCount}</td><td class="num">${r.agg.sheets.length}</td></tr>`).join('')}
      </table>
    </div>
    <div class="card" style="overflow-x:auto;">
      <h2>By person</h2>
      <table><tr><th>Name</th><th>Role</th>${results.map(r=>`<th class="num">${seasonLabel(r.key)}</th>`).join('')}</tr>
      ${(()=>{
        const roleOrder={Gun:0,Beater:1,Guest:2};
        const roleOf = {};
        results.forEach(r=>Object.entries(r.agg.attendance).forEach(([n,role])=>{ if(!(n in roleOf)) roleOf[n]=role; }));
        const names = Array.from(allNames).sort((a,b)=> (roleOrder[roleOf[a]]-roleOrder[roleOf[b]]) || a.localeCompare(b));
        return names.map(name=>`<tr><td>${name}</td><td>${roleOf[name]}</td>${results.map(r=>`<td class="num">${r.agg.attendance[name] ? '✓' : '—'}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${results.length+2}">No one logged yet.</td></tr>`;
      })()}
      </table>
    </div>
    <div class="card" style="overflow-x:auto;">
      <h2>By species</h2>
      <table><tr><th>Species</th>${results.map(r=>`<th class="num">${seasonLabel(r.key)}</th>`).join('')}</tr>
      ${speciesList.filter(sp=>results.some(r=>r.agg.speciesTotals[sp.name]>0)).map(sp=>`<tr><td>${sp.name}</td>${results.map(r=>`<td class="num">${r.agg.speciesTotals[sp.name]||0}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${results.length+1}">Nothing logged yet.</td></tr>`}
      </table>
    </div>
  `;
}
function toggleCompareSeason(key,checked){ if(checked) compareSelected.add(key); else compareSelected.delete(key); render(); }
function toggleCutoff(checked){ compareCutoffOn=checked; render(); }
function setCutoffDate(val){ const d=new Date(val); compareCutoffDate={month:d.getMonth(), day:d.getDate()}; render(); }

function sweepWinners(s){
  const all = [...(s.guns||[]), ...(s.beaters||[]), ...(s.guests||[])];
  const withGuess = all.filter(p=>p.sweep!==''&&p.sweep!=null&&!isNaN(Number(p.sweep)));
  if (!withGuess.length) return new Set();
  let best = Infinity;
  withGuess.forEach(p=>{ const d=Math.abs(Number(p.sweep)-Number(s.grandTotal||0)); if(d<best) best=d; });
  return new Set(withGuess.filter(p=>Math.abs(Number(p.sweep)-Number(s.grandTotal||0))===best).map(p=>p.name));
}

}
function addFormulaTerm(){ formulaDraft.push({term:'shots', op: formulaDraft.length?'+':null}); renderFormulaRows(); }
function removeFormulaTerm(i){ formulaDraft.splice(i,1); if(formulaDraft.length) formulaDraft[0].op=null; renderFormulaRows(); }
function updateFormulaTerm(i,val){ formulaDraft[i].term=val; }
function updateFormulaOp(i,val){ formulaDraft[i].op=val; }
function saveFormula(){
  const seasonFormulas = {...(appSettings.seasonFormulas||{})};
  seasonFormulas[formulaSeasonKey] = JSON.parse(JSON.stringify(formulaDraft));
  db.collection('settings').doc('config').set({seasonFormulas},{merge:true}).then(()=>{ document.getElementById('formulaMsg').textContent='Saved.'; });
}

/* ================= ADD / EDIT SHEET (admin only) ================= */
let formGuns=[], formBeaters=[], formGuests=[], formDrives=[], formWeather=null;

function renderAddForm(app){
  const editing = editingId ? allSheets.find(x=>x.id===editingId) : null;
  if (editingId && !editing) editingId=null;

  formGuns = editing ? JSON.parse(JSON.stringify(editing.guns||[])) : [{name:'',sweep:'',havePaid:false}];
  formBeaters = editing ? JSON.parse(JSON.stringify(editing.beaters||[])) : [{name:'',sweep:'',beenPaid:false}];
  formGuests = editing ? JSON.parse(JSON.stringify(editing.guests||[])) : [];
  formDrives = editing ? JSON.parse(JSON.stringify(editing.drives||[])) : [];
  formWeather = editing ? (editing.weather||null) : null;
  const gameVals = editing ? (editing.game||{}) : {};
  const speciesList = appSettings.speciesList || DEFAULT_SPECIES;

  app.innerHTML = `
    <div class="card">
      <h2>${editing ? 'Edit sheet' : 'Add a new sheet'}</h2>
      <p class="hint">Fill this in from the paper wing shoot sheet.</p>
      ${GEMINI_API_KEY ? `
      <div class="section-title">Photo pre-fill</div>
      <p class="hint">Upload a photo — fields below get pre-filled, check against the paper before saving.</p>
      <input type="file" accept="image/*" id="photoInput" onchange="handlePhotoUpload(event)">
      <div class="msg" id="photoMsg"></div>` : ''}

      <div class="section-title">When</div>
      <div class="grid2">
        <div class="field"><label>Date of shoot</label><input type="date" id="f_date" value="${editing ? editing.date : ''}"></div>
        <div class="field"><label>Notes (optional)</label><input type="text" id="f_notes" value="${editing && editing.notes ? editing.notes : ''}"></div>
      </div>
      <div class="field" id="weatherBox"></div>
      <div class="msg hint" id="guestPrefillMsg"></div>

      <div class="section-title">Guns</div>
      <div id="gunsRows"></div>
      <button class="btn ghost small" onclick="addPersonRow('guns')">+ add gun</button>

      <div class="section-title">Beaters</div>
      <div id="beatersRows"></div>
      <button class="btn ghost small" onclick="addPersonRow('beaters')">+ add beater</button>

      <div class="section-title">Guests</div>
      <div id="guestsRows"></div>
      <button class="btn ghost small" onclick="addPersonRow('guests')">+ add guest</button>

      <div class="section-title">Game shot</div>
      <div id="gameRows"></div>

      ${appSettings.drivesEnabled ? `
      <div class="section-title">Drives</div>
      <div id="drivesRows"></div>
      <button class="btn ghost small" id="addDriveBtn" onclick="addDriveRow()">+ add drive</button>` : ''}

      <div class="section-title">Shoot totals</div>
      <div class="grid2">
        <div class="field"><label>Total shot</label><input type="number" id="f_totalShot" value="${editing ? editing.totalShot : ''}"></div>
        <div class="field"><label>Cartridges</label><input type="number" id="f_cartridges" value="${editing ? editing.cartridges : ''}"></div>
      </div>

      <div class="card" style="background:var(--paper);">
        <div class="headline" style="margin-bottom:6px;"><div class="num" id="liveGrandTotal" style="font-size:36px;">0</div><div class="label">grand total (live)</div></div>
        <div id="liveFormulaBreakdown"></div>
      </div>

      <div style="margin-top:18px;display:flex;gap:10px;">
        <button class="btn" onclick="saveSheet()">${editing ? 'Save changes' : 'Save sheet'}</button>
        <button class="btn ghost" onclick="cancelForm()">Cancel</button>
      </div>
      <div class="msg err" id="formMsg"></div>
    </div>
  `;
  renderPersonRows('guns'); renderPersonRows('beaters'); renderPersonRows('guests');
  renderGameRows(gameVals);
  if (appSettings.drivesEnabled) renderDriveRows();
  renderWeatherBox();
  if (editing && editing.date) tryPrefillGuests(editing.date, true);
  ['f_totalShot','f_cartridges'].forEach(id=>document.getElementById(id).addEventListener('input', updateLiveTotal));
  document.getElementById('f_date').addEventListener('change', e=>{ fetchWeatherFor(e.target.value); tryPrefillGuests(e.target.value, false); });
  updateLiveTotal();
}

function tryPrefillGuests(dateStr, silentIfNoneNew){
  const day = allShootDays.find(d=>d.date===dateStr);
  const msg = document.getElementById('guestPrefillMsg');
  if (!day || (!day.guest1 && !day.guest2)){ if(msg) msg.textContent=''; return; }
  const names = [day.guest1, day.guest2].filter(Boolean);
  let added = 0;
  names.forEach(n=>{
    if (!formGuests.some(g=>g.name===n)){ formGuests.push({name:n, sweep:''}); added++; }
  });
  if (added>0){ renderPersonRows('guests'); if(msg) msg.textContent = `${added} guest(s) pulled in from the Shoot Days schedule for this date.`; }
  else if (!silentIfNoneNew && msg) msg.textContent = '';
}

function renderWeatherBox(){
  const box = document.getElementById('weatherBox'); if(!box) return;
  if (!formWeather){ box.innerHTML = `<label>Weather</label><p class="hint" style="margin:0;">Pick a date above to look up the weather automatically.</p>`; }
  else { box.innerHTML = `<label>Weather</label><p style="margin:0;font-size:14px;">${formWeather.summary} · ${formWeather.tempMax}°C / ${formWeather.tempMin}°C · wind ${formWeather.windMax} km/h ${formWeather.windDir||''}</p>`; }
}
function weatherCodeToText(code){
  const map={0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Violent showers',95:'Thunderstorm'};
  return map[code]||'Unknown';
}
function degreesToCompass(deg){
  const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg/22.5)%16];
}
function fetchWeatherFor(dateStr){
  if (!dateStr) return;
  const box = document.getElementById('weatherBox');
  box.innerHTML = `<label>Weather</label><p class="hint" style="margin:0;">Looking up…</p>`;
  const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${SHOOT_LAT}&longitude=${SHOOT_LON}&start_date=${dateStr}&end_date=${dateStr}&daily=temperature_2m_max,temperature_2m_min,windspeed_10m_max,winddirection_10m_dominant,weathercode&timezone=auto`;
  fetch(url).then(r=>r.json()).then(data=>{
    if (!data.daily || !data.daily.time.length) throw new Error('no data');
    formWeather = { tempMax:data.daily.temperature_2m_max[0], tempMin:data.daily.temperature_2m_min[0], windMax:data.daily.windspeed_10m_max[0], windDir: degreesToCompass(data.daily.winddirection_10m_dominant[0]), summary:weatherCodeToText(data.daily.weathercode[0]) };
    renderWeatherBox();
  }).catch(()=>{ formWeather=null; box.innerHTML = `<label>Weather</label><p class="hint" style="margin:0;">Couldn't look up weather for this date.</p>`; });
}

function handlePhotoUpload(evt){
  const file = evt.target.files[0]; if(!file) return;
  const msg = document.getElementById('photoMsg');
  msg.className='msg'; msg.textContent='Reading the sheet…';
  const speciesNames = (appSettings.speciesList||DEFAULT_SPECIES).map(s=>s.name);
  const reader = new FileReader();
  reader.onload = () => {
    const base64 = reader.result.split(',')[1];
    const prompt = `You are reading a handwritten "wing shoot" sheet. It has two people tables: "GUNS" and "BEATERS" (name, sweep number). It has a "GAME SHOT NO" table listing species and counts, from this list: ${speciesNames.join(', ')}. It shows TOTAL SHOT and CARTRIDGES figures. Return ONLY valid JSON, no markdown:
{"guns":[{"name":"","sweep":0}],"beaters":[{"name":"","sweep":0}],"game":{"Pheasant":0},"totalShot":0,"cartridges":0}
Only include species with a number written next to them. Omit illegible fields rather than guessing.`;
    fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:file.type||'image/jpeg',data:base64}}]}]})
    }).then(r=>r.json()).then(data=>{
      const text = data.candidates[0].content.parts[0].text;
      const parsed = JSON.parse(text.replace(/```json|```/g,'').trim());
      if ((parsed.guns||[]).length) formGuns = parsed.guns;
      if ((parsed.beaters||[]).length) formBeaters = parsed.beaters;
      renderPersonRows('guns'); renderPersonRows('beaters');
      renderGameRows(parsed.game||{});
      if (parsed.totalShot) document.getElementById('f_totalShot').value = parsed.totalShot;
      if (parsed.cartridges) document.getElementById('f_cartridges').value = parsed.cartridges;
      updateLiveTotal();
      msg.className='msg ok'; msg.textContent='Pre-filled — check every field against the paper sheet before saving.';
    }).catch(()=>{ msg.className='msg err'; msg.textContent="Couldn't read that photo — try a clearer shot, or fill it in by hand."; });
  };
  reader.readAsDataURL(file);
}

function renderPersonRows(kind){
  const container = document.getElementById(kind+'Rows');
  const arr = kind==='guns'?formGuns:kind==='beaters'?formBeaters:formGuests;
  const paidLabel = kind==='guns' ? 'Have paid' : kind==='beaters' ? 'Been paid' : null;
  const paidField = kind==='guns' ? 'havePaid' : kind==='beaters' ? 'beenPaid' : null;
  container.innerHTML = arr.map((p,i)=>`
    <div class="grid3 person-row" style="grid-template-columns:${paidLabel?'2fr 1fr 1fr auto':'2fr 1fr auto'};">
      <div><input type="text" placeholder="Name" value="${p.name||''}" onchange="updatePerson('${kind}',${i},'name',this.value)"></div>
      <div><input type="number" placeholder="Sweep" value="${p.sweep||''}" onchange="updatePerson('${kind}',${i},'sweep',this.value)"></div>
      ${paidLabel ? `<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;margin:0;">
        <input type="checkbox" ${p[paidField]?'checked':''} onchange="updatePersonBool('${kind}',${i},'${paidField}',this.checked)"> ${paidLabel}</label>` : ''}
      <button class="remove-x" onclick="removePersonRow('${kind}',${i})">&times;</button>
    </div>`).join('');
}
function addPersonRow(kind){
  const arr = kind==='guns'?formGuns:kind==='beaters'?formBeaters:formGuests;
  arr.push(kind==='guns'?{name:'',sweep:'',havePaid:false}:kind==='beaters'?{name:'',sweep:'',beenPaid:false}:{name:'',sweep:''});
  renderPersonRows(kind);
}
function removePersonRow(kind,i){ const arr=kind==='guns'?formGuns:kind==='beaters'?formBeaters:formGuests; arr.splice(i,1); renderPersonRows(kind); }
function updatePerson(kind,i,field,val){ const arr=kind==='guns'?formGuns:kind==='beaters'?formBeaters:formGuests; arr[i][field]=val; }
function updatePersonBool(kind,i,field,val){ const arr=kind==='guns'?formGuns:formBeaters; arr[i][field]=val; }

function renderGameRows(vals){
  const container = document.getElementById('gameRows');
  const speciesList = appSettings.speciesList || DEFAULT_SPECIES;
  container.innerHTML = `<div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">` + speciesList.map(sp=>{
    if (sp.splitSex){
      return `<div class="field" style="margin-bottom:0;"><label>${sp.name}</label>
        <div style="display:flex;gap:6px;">
          <input type="number" placeholder="M" data-species="${sp.name} (M)" value="${vals[sp.name+' (M)']||''}" class="gameInput" oninput="updateLiveTotal()">
          <input type="number" placeholder="F" data-species="${sp.name} (F)" value="${vals[sp.name+' (F)']||''}" class="gameInput" oninput="updateLiveTotal()">
        </div></div>`;
    }
    return `<div class="field" style="margin-bottom:0;"><label>${sp.name}</label>
      <input type="number" data-species="${sp.name}" value="${vals[sp.name]||''}" class="gameInput" oninput="updateLiveTotal()"></div>`;
  }).join('') + `</div>`;
}
function collectGame(){
  const out = {};
  document.querySelectorAll('.gameInput').forEach(inp=>{ const v=Number(inp.value||0); if(v) out[inp.dataset.species]=v; });
  if (appSettings.drivesEnabled){
    formDrives.forEach(d=>{ if(d.species && Number(d.shots)) out[d.species]=(out[d.species]||0)+Number(d.shots); });
  }
  return out;
}
function renderDriveRows(){
  const container = document.getElementById('drivesRows'); if(!container) return;
  const names = appSettings.driveNames||[];
  const speciesList = appSettings.speciesList || DEFAULT_SPECIES;
  container.innerHTML = formDrives.map((d,i)=>`
    <div class="grid3 person-row">
      <div><select onchange="updateDrive(${i},'name',this.value)"><option value="">Select drive…</option>
        ${names.map(n=>`<option value="${n}" ${d.name===n?'selected':''}>${n}</option>`).join('')}</select></div>
      <div><select onchange="updateDrive(${i},'species',this.value)"><option value="">Species…</option>
        ${speciesList.map(sp=>`<option value="${sp.name}" ${d.species===sp.name?'selected':''}>${sp.name}</option>`).join('')}</select></div>
      <div><input type="number" placeholder="Shots" value="${d.shots||''}" onchange="updateDrive(${i},'shots',this.value)"></div>
      <button class="remove-x" onclick="removeDriveRow(${i})">&times;</button>
    </div>`).join('') || '<p class="hint">No drives added yet.</p>';
  const addBtn = document.getElementById('addDriveBtn'); if(addBtn) addBtn.disabled = formDrives.length>=10;
}
function addDriveRow(){ if(formDrives.length<10){ formDrives.push({name:'',species:'',shots:''}); renderDriveRows(); } }
function removeDriveRow(i){ formDrives.splice(i,1); renderDriveRows(); updateLiveTotal(); }
function updateDrive(i,field,val){ formDrives[i][field]=val; if(field==='shots') updateLiveTotal(); }

function updateLiveTotal(){
  const totalShot = Number(document.getElementById('f_totalShot').value||0);
  const cartridges = Number(document.getElementById('f_cartridges').value||0);
  const game = collectGame();
  const seasonKey = seasonKeyForDate(new Date(document.getElementById('f_date').value || Date.now()));
  const formula = getSeasonFormula(seasonKey);
  const facts = computeSheetFacts({guns:formGuns, beaters:formBeaters, guests:formGuests, game, cartridges});
  const grand = evalFormula(formula, facts);
  document.getElementById('liveGrandTotal').textContent = grand.toLocaleString();
  document.getElementById('liveFormulaBreakdown').innerHTML = formulaBreakdownHTML(formula, facts, grand);
}

function cancelForm(){ const wasEditing=editingId; editingId=null; switchTab(wasEditing?'sheet-detail':'sheets'); if(wasEditing){editingId=wasEditing; currentTab='sheet-detail'; render();} }

function saveSheet(){
  const date = document.getElementById('f_date').value;
  if (!date){ document.getElementById('formMsg').textContent='Please pick a date.'; return; }
  const totalShot = Number(document.getElementById('f_totalShot').value||0);
  const cartridges = Number(document.getElementById('f_cartridges').value||0);
  const game = collectGame();
  const cleanPeople = (arr, extra) => arr.filter(p=>p.name&&p.name.trim()).map(p=>{
    const o = {name:p.name.trim(), sweep:Number(p.sweep||0)};
    if (extra) o[extra] = !!p[extra];
    return o;
  });
  const cleanDrives = (formDrives||[]).filter(d=>d.name&&d.species).map(d=>({name:d.name, species:d.species, shots:Number(d.shots||0)}));
  const seasonKey = seasonKeyForDate(new Date(date));
  const formula = getSeasonFormula(seasonKey);
  const guns = cleanPeople(formGuns,'havePaid'), beaters=cleanPeople(formBeaters,'beenPaid'), guests=cleanPeople(formGuests,null);
  const facts = computeSheetFacts({guns,beaters,guests,game,cartridges});
  const grandTotal = evalFormula(formula, facts);

  const payload = {
    date, notes: document.getElementById('f_notes').value.trim(),
    guns, beaters, guests, game, totalShot, cartridges, grandTotal,
    drives: cleanDrives, weather: formWeather||null,
    formulaUsed: formula, factsUsed: facts
  };
  const ref = editingId ? db.collection('sheets').doc(editingId) : db.collection('sheets').doc();
  ref.set(payload).then(()=>{ editingId=ref.id; currentTab='sheet-detail'; render(); })
     .catch(e=>{ document.getElementById('formMsg').textContent=e.message; });
}
</script>
